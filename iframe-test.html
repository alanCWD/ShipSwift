<!DOCTYPE html>
<html>
<head>
    <title>Iframe Embedding Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        iframe { width: 100%; height: 800px; border: 2px solid #ccc; }
        .controls { margin: 20px 0; }
        button { padding: 10px 20px; margin: 5px; }
        .logs { background: #f5f5f5; padding: 15px; margin: 20px 0; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>GoABLP Iframe Embedding Test</h1>
    
    <div class="controls">
        <button onclick="clearLogs()">Clear Logs</button>
        <button onclick="reloadIframe()">Reload Iframe</button>
        <button onclick="testDirectAccess()">Test Direct Access</button>
    </div>
    
    <div class="logs" id="logs">
        <strong>Console Logs:</strong><br>
    </div>
    
    <iframe id="shipswift-iframe" src="https://ship-swift-ablp.replit.app" 
            allow="cross-origin-isolated">
    </iframe>
    
    <script>
        function log(message) {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            logs.innerHTML += `[${timestamp}] ${message}<br>`;
            logs.scrollTop = logs.scrollHeight;
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '<strong>Console Logs:</strong><br>';
        }
        
        function reloadIframe() {
            const iframe = document.getElementById('shipswift-iframe');
            iframe.src = iframe.src;
            log('Iframe reloaded');
        }
        
        function testDirectAccess() {
            fetch('https://ship-swift-ablp.replit.app/api/auth/user', {
                credentials: 'include',
                mode: 'cors'
            })
            .then(response => {
                log(`Direct API test: ${response.status} ${response.statusText}`);
                return response.text();
            })
            .then(data => {
                log(`Response: ${data.substring(0, 100)}...`);
            })
            .catch(error => {
                log(`Error: ${error.message}`);
            });
        }
        
        // Listen for messages from iframe
        window.addEventListener('message', function(event) {
            log(`Message from iframe: ${JSON.stringify(event.data)}`);
        });
        
        // Log iframe load events
        document.getElementById('shipswift-iframe').addEventListener('load', function() {
            log('Iframe loaded successfully');
        });
        
        document.getElementById('shipswift-iframe').addEventListener('error', function() {
            log('Iframe failed to load');
        });
        
        log('Test page initialized');
    </script>
</body>
</html>
