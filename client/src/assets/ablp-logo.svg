<svg width="120" height="60" viewBox="0 0 120 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- GoABLP Logo -->
  <rect width="120" height="60" rx="8" fill="#1E40AF"/>
  
  <!-- GoABLP Text -->
  <text x="8" y="35" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">
    GoABLP
  </text>
  
  <!-- Tagline Text -->
  <text x="8" y="50" font-family="Inter, sans-serif" font-size="8" font-weight="400" fill="white" opacity="0.9">
    Subsidiary of ABLP Logistics
  </text>
  
  <!-- Decorative shipping icon -->
  <rect x="85" y="20" width="24" height="16" rx="2" stroke="white" stroke-width="1.5" fill="none"/>
  <rect x="87" y="22" width="4" height="4" fill="white"/>
  <rect x="93" y="22" width="4" height="4" fill="white"/>
  <rect x="99" y="22" width="4" height="4" fill="white"/>
  <rect x="87" y="28" width="4" height="4" fill="white"/>
  <rect x="93" y="28" width="4" height="4" fill="white"/>
  <rect x="99" y="28" width="4" height="4" fill="white"/>
  
  <!-- Truck wheels -->
  <circle cx="88" cy="40" r="3" stroke="white" stroke-width="1.5" fill="none"/>
  <circle cx="105" cy="40" r="3" stroke="white" stroke-width="1.5" fill="none"/>
  
  <!-- Truck cab -->
  <rect x="82" y="30" width="8" height="8" rx="1" stroke="white" stroke-width="1.5" fill="none"/>
